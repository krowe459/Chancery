name: chancery-scrape

on:
  schedule:
    # Every 2 hours, Mon-Fri, 11:17-23:17 UTC
    #   = 7:17am-7:17pm EDT (summer) / 6:17am-6:17pm EST (winter).
    # Minute :17 avoids the top-of-hour queue where GitHub delays scheduled runs.
    - cron: "17 11-23/2 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "First run only: summarize this many existing opinions instead of seeding them"
        required: false
        default: "0"

permissions:
  contents: write

# Shared with the digest workflow: state/*.json is never written by two jobs at once.
concurrency:
  group: chancery-state
  cancel-in-progress: false

env:
  TZ: America/New_York
  PYTHONUNBUFFERED: "1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard cap so a hung request can't burn free-tier minutes. The scrape step
    # stops itself after RUN_TIME_BUDGET_MINUTES (40) and is killed at 50; the
    # remaining 10 leave room for the state commit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Always start from the branch tip. Without this, a re-run checks out
          # the run's original commit, missing state committed since then.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt

      - name: Detect changes and summarize new opinions
        id: scrape
        working-directory: src
        timeout-minutes: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          VERIFY_FACTS: ${{ vars.VERIFY_FACTS || '1' }}
          MAX_CASES_PER_RUN: ${{ vars.MAX_CASES_PER_RUN || '8' }}
          RUN_TOKEN_BUDGET: ${{ vars.RUN_TOKEN_BUDGET || '400000' }}
          RUN_TIME_BUDGET_MINUTES: ${{ vars.RUN_TIME_BUDGET_MINUTES || '40' }}
          MAX_AGE_BUSINESS_DAYS: ${{ vars.MAX_AGE_BUSINESS_DAYS || '2' }}
          LISTING_RETRIES: ${{ vars.LISTING_RETRIES || '2' }}
          LISTING_RETRY_WAIT: ${{ vars.LISTING_RETRY_WAIT || '60' }}
          BACKFILL: ${{ github.event.inputs.backfill || '0' }}
        run: python scrape.py

      # Runs even if the scrape step failed or was killed at its time limit:
      # state is saved atomically after each opinion, so whatever finished is
      # committed and never re-billed. A no-op when nothing changed.
      - name: Commit state
        if: always() && steps.scrape.outcome != 'skipped'
        run: "scripts/commit_state.sh 'chore(state): scrape'"
