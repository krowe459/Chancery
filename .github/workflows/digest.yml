name: chancery-digest

on:
  schedule:
    # GitHub cron is UTC-only. Three slots so one lands at/after 6pm New York
    # in both EDT and EST, with a backup; send_digest.py's NY-hour gate plus the
    # sent_digests.json ledger ensure exactly one email per NY day.
    #   22:07 UTC = 6:07pm EDT | 5:07pm EST (gate: too early, exits)
    #   23:07 UTC = 7:07pm EDT (already sent) | 6:07pm EST (sends)
    #   00:07 UTC Tue-Sat = prior NY weekday evening (backup if both above failed)
    - cron: "7 22,23 * * 1-5"
    - cron: "7 0 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the 6pm New York gate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chancery-state
  cancel-in-progress: false

env:
  TZ: America/New_York
  PYTHONUNBUFFERED: "1"

jobs:
  digest:
    runs-on: ubuntu-latest
    # The pre-digest scrape is capped at 20 minutes; sending takes seconds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Always start from the branch tip. Without this, a re-run checks out
          # the run's original commit, missing state committed since then.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -q -r requirements.txt

      - name: Check whether a digest is due
        id: due
        working-directory: src
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python send_digest.py --check --force; else python send_digest.py --check; fi

      # Last-minute scrape so opinions posted after the last scheduled scrape
      # (5:45pm EDT) still make tonight's email. Only when a digest is about to
      # go out, and never allowed to block it: a failure or a long run just
      # leaves new opinions for tomorrow's digest, as before.
      - name: Scrape for opinions posted since the last run
        id: prescrape
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 20
        working-directory: src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          VERIFY_FACTS: ${{ vars.VERIFY_FACTS || '1' }}
          MAX_CASES_PER_RUN: ${{ vars.MAX_CASES_PER_RUN || '8' }}
          RUN_TOKEN_BUDGET: ${{ vars.RUN_TOKEN_BUDGET || '400000' }}
          # Keep the email from going out much later than usual.
          RUN_TIME_BUDGET_MINUTES: ${{ vars.PREDIGEST_TIME_BUDGET_MINUTES || '12' }}
          MAX_AGE_BUSINESS_DAYS: ${{ vars.MAX_AGE_BUSINESS_DAYS || '2' }}
          LISTING_RETRIES: ${{ vars.LISTING_RETRIES || '2' }}
          LISTING_RETRY_WAIT: ${{ vars.LISTING_RETRY_WAIT || '60' }}
        run: python scrape.py

      - name: Commit scrape state
        if: always() && steps.prescrape.outcome != 'skipped'
        continue-on-error: true   # a push hiccup here must not stop the email
        run: "scripts/commit_state.sh 'chore(state): pre-digest scrape'"

      - name: Compile and send digest
        id: digest
        working-directory: src
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then python send_digest.py --force; else python send_digest.py; fi

      - name: Commit state
        if: steps.digest.outputs.sent == 'true'
        run: "scripts/commit_state.sh 'chore(state): digest sent'"
